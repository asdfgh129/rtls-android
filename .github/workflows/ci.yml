name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Migration up/down/up on fresh DB
        if: matrix.node == '24'
        env:
          DATABASE_PATH: ${{ runner.temp }}/rtls-ci.db
        run: |
          npm run migrate -- up
          for _ in 1 2 3 4 5 6; do
            npm run migrate -- down
          done
          npm run migrate -- up
          node -e "const D=require('better-sqlite3');const db=new D(process.env.DATABASE_PATH);const integrity=db.pragma('integrity_check',{simple:true});const autoVacuum=db.pragma('auto_vacuum',{simple:true});if(integrity!=='ok'||autoVacuum!==2){console.error({integrity,autoVacuum});process.exit(1)}console.log({integrity,autoVacuum})"

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Markdown links
        run: python3 scripts/check-links.py
      - name: CHANGELOG gate
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          ACTOR: ${{ github.actor }}
        run: python3 scripts/check-changelog.py

  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install lockfile
        working-directory: server
        run: npm ci --ignore-scripts
      - name: Production dependency audit
        working-directory: server
        run: npm audit --omit=dev --audit-level=high
